# General settings
mode: run  # Mode of operation: "run" for simulation, "plot" for visualization
name: example_run  # Unique name for this simulation instance (existing names abort the run)

# Agent settings
max_speed: 6  # Maximum speed of the agent
desired_distance: 13  # Desired distance between agents
safe_distance: 5  # Minimum safe distance between agents
formation: "circle"  # e.g. "circle", "square", "equilateral triangle", "letter D"
agent_mode: "influence"  # "influence", "naive", "basic", or "plan"
initial_position: [[10, 10], [30, 15], [80, 10], [80, 50], [90, 90], [20, 80]]
randomize: True  # Randomize initial positions of agents (overrides initial_position)
comm_range: 30  # Communication range of agents
leader_id: 0  # Identifier for the leader agent (used in 'plan' mode)

# Simulation settings
seed: 42  # Random seed for reproducibility
spawn_x_min: 0.0  # Lower bound of the agent's random spawn range (X coordinate)
spawn_x_max: 100.0  # Upper bound of the agent's random spawn range (X coordinate)
spawn_y_min: 0.0  # Lower bound of the agent's random spawn range (Y coordinate)
spawn_y_max: 100.0  # Upper bound of the agent's random spawn range (Y coordinate)
dt: 1  # Time step for simulation
wait: 60  # Time to wait between each round (avoid rate limits)

# Target settings
target_active: False  # Enable moving targets
targets: 1  # Number of targets
target_speed: [0, 0]  # Speed of target
target_position: [[50, 50]]  # Initial position of the target

rounds: 10  # Number of rounds for the simulation
zombies: 0  # Number of inactive agents that do not participate
agents: 6  # Total number of agents in the simulation
memory_limit: 4  # Message history length each agent remembers
collision_reprompt_attempts: 2  # Max reprompt cycles for conflicted agents per round
agent_response_timeout: 240  # Max seconds to wait for each agent movement response
collision_buffer: 0.5  # Extra distance margin added to safe_distance in checker

###### LLM Models ############################
model: "gpt-5-mini"
model_company: "openai"
reasoning_effort: "low"  # gpt-5 family only: "minimal", "low", "medium", "high"

# Other providers (uncomment one set to switch):
#
# model: "claude-sonnet-4-20250514"
# model_company: "claude"
# use_pydantic_ai: True
#
# model: "deepseek-reasoner"
# model_company: "deepseek_api"
#
# model: "qwen-max"
# model_company: "qwen"
#
# model: "llama3.1-405b"
# model_company: "llama_api"

# Plotting settings
x_min: 0  # Minimum X-axis value in the plot
x_max: 100  # Maximum X-axis value in the plot
x_ticks: 20  # Interval for ticks on the X-axis
y_min: 0  # Minimum Y-axis value in the plot
y_max: 100  # Maximum Y-axis value in the plot
y_ticks: 20  # Interval for ticks on the Y-axis
plot: 1  # Enable plotting (1 for Yes, 0 for No)
